version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - gosec
  settings:
    depguard:
      rules:
        all:
          deny:
            - pkg: golang.org/x/crypto/openpgp
              desc: unmaintained, no fix for GO-2026-5932 (R-001)
            - pkg: math/rand
              desc: security randomness comes from crypto/rand only
            - pkg: math/rand/v2
              desc: security randomness comes from crypto/rand only
    # Module boundary rules (BASELINE §4.4) are added in P2.

formatters:
  enable:
    - gofmt
